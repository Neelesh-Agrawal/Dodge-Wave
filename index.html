<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DODGE WAVE | Wave 01</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'dodge_wave_best';
  const STORAGE_THEME = 'dodge_wave_theme';
  const STORAGE_DAILY = 'dodge_wave_daily_best';
  const PLAYER_R = 18;
  const PROJ_R = 10;
  const COLL_PLAYER = PLAYER_R - 3;
  const COLL_PROJ = PROJ_R - 3;
  const NEAR_MISS = 30;
  const PLAYER_BOTTOM = 80;
  const UI_STRIP = 40;
  const DT_CAP = 0.05;
  const THEME_DEFS = [
    { id: 'nebula', label: 'NEBULA', unlock: 0, player: '#6c63ff', coral: '#ff4d6d', cyan: '#00f5ff', amber: '#ffbe0b', green: '#39ff14', accent: '108,99,255' },
    { id: 'solar', label: 'SOLAR', unlock: 5, player: '#ff6b35', coral: '#ff3366', cyan: '#ffd93d', amber: '#ff9f1c', green: '#2ec4b6', accent: '255,107,53' },
    { id: 'matrix', label: 'MATRIX', unlock: 10, player: '#3bf0a5', coral: '#ff0055', cyan: '#00ff9f', amber: '#cfff04', green: '#00ff66', accent: '59,240,165' },
    { id: 'arctic', label: 'ARCTIC', unlock: 15, player: '#7dd3fc', coral: '#f472b6', cyan: '#a5f3fc', amber: '#fde047', green: '#86efac', accent: '125,211,252' },
    { id: 'void', label: 'VOID', unlock: 20, player: '#e879f9', coral: '#fb7185', cyan: '#22d3ee', amber: '#fcd34d', green: '#a3e635', accent: '232,121,249' }
  ];

  let COLORS = {};
  let themeAccentRgb = '108,99,255';
  let themeIndex = 0;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let playerX = 0, playerTargetX = 0;
  let prevPlayerX = 0;
  let pointerDown = false;
  let keys = {};
  const MOVE_SPEED = 520;

  let gameState = 'title'; // title | playing | breather | gameover
  let wave = 1;
  let wavesSurvived = 0;
  let highScore = 0;
  let projectiles = [];
  let particles = [];
  let stars = [];
  let demoProjs = [];
  let rafId = null;
  let lastT = 0;

  let waveTotalSpawned = 0;
  let waveRemainingCount = 0;
  let breatherEnd = 0;
  let nextWaveNum = 1;
  let countdownPhase = 0;
  let waveFlashUntil = 0;
  let waveFlashNum = 0;
  let bottomExitFlashes = [];
  let fullScreenGreen = 0;

  let gameOverAt = 0;
  let gameOverOverlayStart = 0;
  let deathShakeUntil = 0;
  let deathShakeStart = 0;
  let vignetteDeathT = -1;

  let audioCtx = null;
  let audioReady = false;
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  let currentPatternId = 1;
  let newBestFlag = false;
  let newDailyBestFlag = false;

  let useSeededRng = false;
  let rngState = 2463534242;

  function setRngSeed(seed) {
    rngState = (seed >>> 0) || 1;
  }
  function rnd() {
    if (!useSeededRng) return Math.random();
    rngState = Math.imul(rngState ^ (rngState >>> 15), rngState | 1);
    rngState ^= rngState + Math.imul(rngState ^ (rngState >>> 7), rngState | 61);
    return ((rngState ^ (rngState >>> 14)) >>> 0) / 4294967296;
  }

  function getDailySeed() {
    const d = new Date();
    return ((d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) ^ 0xdecafbad) >>> 0;
  }
  function getDailyDateKey() {
    const d = new Date();
    const mo = d.getMonth() + 1, da = d.getDate();
    return d.getFullYear() + '-' + (mo < 10 ? '0' : '') + mo + '-' + (da < 10 ? '0' : '') + da;
  }

  let runMode = 'classic';
  let practiceStartWave = 1;
  let titleScreen = 'main';
  let titleRegions = [];

  let runStartTime = 0;
  let statNearMisses = 0;
  let waveHadNearMiss = false;
  let statPerfectStreak = 0;
  let statBestPerfectStreak = 0;
  let dailyBestScore = 0;
  let dailyBestDate = '';

  let ghostRecord = [];
  let ghostPlayback = null;
  let lastGhostRun = null;

  let copyToastUntil = 0;
  let lastRunOpts = { mode: 'classic', practiceWave: 1 };
  let gameOverRegions = [];

  function loadHigh() {
    try {
      const v = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
      highScore = isNaN(v) ? 0 : v;
    } catch (e) { highScore = 0; }
  }
  function saveHigh(v) {
    try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
  }

  function loadTheme() {
    try {
      const t = parseInt(localStorage.getItem(STORAGE_THEME) || '0', 10);
      themeIndex = isNaN(t) ? 0 : clamp(t, 0, THEME_DEFS.length - 1);
    } catch (e) { themeIndex = 0; }
    if (!themeUnlocked(themeIndex)) themeIndex = 0;
    applyTheme(themeIndex);
  }
  function saveTheme() {
    try { localStorage.setItem(STORAGE_THEME, String(themeIndex)); } catch (e) {}
  }
  function applyTheme(i) {
    const th = THEME_DEFS[clamp(i, 0, THEME_DEFS.length - 1)];
    COLORS.coral = th.coral;
    COLORS.cyan = th.cyan;
    COLORS.amber = th.amber;
    COLORS.green = th.green;
    COLORS.player = th.player;
    themeAccentRgb = th.accent;
  }
  function themeUnlocked(ti) {
    return highScore >= THEME_DEFS[ti].unlock;
  }

  function loadDailyBest() {
    try {
      const raw = localStorage.getItem(STORAGE_DAILY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (o && o.date) {
        dailyBestDate = o.date;
        dailyBestScore = parseInt(o.best, 10) || 0;
      }
    } catch (e) {
      dailyBestScore = 0;
      dailyBestDate = '';
    }
  }
  function saveDailyBest(dateKey, score) {
    try {
      localStorage.setItem(STORAGE_DAILY, JSON.stringify({ date: dateKey, best: score }));
    } catch (e) {}
    dailyBestDate = dateKey;
    dailyBestScore = score;
  }

  function pointInRect(px, py, rx, ry, rw, rh) {
    return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    playerX = clamp(playerX || W / 2, PLAYER_R * DPR, W - PLAYER_R * DPR);
    playerTargetX = playerX;
    initStars();
    if (gameState === 'title') initDemoProjs();
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: (0.5 + Math.random()) * DPR,
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function initDemoProjs() {
    demoProjs = [];
    for (let i = 0; i < 5; i++) {
      demoProjs.push({
        x: (0.15 + 0.7 * Math.random()) * W,
        y: Math.random() * H,
        vy: 40 * DPR,
        rot: Math.random() * Math.PI * 2,
        color: COLORS.coral
      });
    }
  }

  function ensureAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  function resumeAudio() {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().then(function () { audioReady = true; }).catch(function () {});
    } else audioReady = !!audioCtx;
  }

  function playTone(freq, dur, gain, type, freqEnd) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd != null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    }
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playNoise(dur, gain) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(g);
    g.connect(audioCtx.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  function sfxSpawnTick() { playTone(600, 0.02, 0.04, 'sine'); }
  function sfxNearMiss() { playNoise(0.08, 0.06); }
  function sfxWaveClear() {
    if (!audioCtx) return;
    playTone(440, 0.12, 0.08, 'sine');
    setTimeout(function () {
      playTone(660, 0.12, 0.08, 'sine');
    }, 120);
  }
  function sfxDeath() { playTone(300, 0.5, 0.12, 'sine', 80); }
  function sfxCountdown() { playTone(440, 0.06, 0.06, 'sine'); }
  function sfxStart() { playTone(200, 0.15, 0.08, 'sine', 500); }

  function fallSpeedForWave(w) {
    if (w <= 3) return 180 * DPR;
    if (w <= 6) return 220 * DPR;
    if (w <= 9) return 270 * DPR;
    let base = 320 * DPR;
    if (w > 10) base *= Math.pow(1.08, w - 10);
    return base;
  }

  function starDriftSpeed() {
    return (5 + (wave - 1) * 0.15) * DPR;
  }

  function makeProjectile(x, y, vy, colorType, spawnDelay, meta) {
    const t = {
      x: x,
      y: y,
      vy: vy,
      colorType: colorType,
      spawnT: (spawnDelay || 0),
      scale: 0,
      spawnAnim: 0,
      rot: rnd() * Math.PI * 2,
      active: spawnDelay <= 0,
      nearMissed: false,
      chaosHue: 0,
      meta: meta || {}
    };
    return t;
  }

  function projColor(p) {
    if (p.colorType === 'chaos') {
      const t = performance.now() / 1000;
      const hues = [348, 180, 45, 120];
      const idx = Math.floor(t * 4) % 4;
      const next = (idx + 1) % 4;
      const blend = (t * 4) % 1;
      return chaosColor(hues[idx], hues[next], blend);
    }
    switch (p.colorType) {
      case 'formation': return COLORS.cyan;
      case 'wall': return COLORS.amber;
      case 'chase': return COLORS.green;
      default: return COLORS.coral;
    }
  }

  function chaosColor(h1, h2, b) {
    const h = h1 + (h2 - h1) * b;
    return 'hsl(' + h + ',100%,60%)';
  }

  function gapWallProjs(gapCenterX, gapW, vy, colorType, y, spawnDelay) {
    const list = [];
    const step = PROJ_R * 2 * DPR;
    const margin = PROJ_R * DPR;
    const gapHalf = (gapW * DPR) / 2;
    const sd = spawnDelay || 0;
    for (let x = margin; x <= W - margin; x += step) {
      if (Math.abs(x - gapCenterX) < gapHalf + PROJ_R * DPR) continue;
      list.push(makeProjectile(x, y, vy, colorType, sd));
    }
    return list;
  }

  function curtainWallProjs(gapCenters, gapWidthPx, vy, colorType, y0, spawnDelay) {
    const list = [];
    const step = PROJ_R * 2 * DPR;
    const margin = PROJ_R * DPR;
    const half = (gapWidthPx * DPR) / 2;
    const sd = spawnDelay || 0;
    for (let x = margin; x <= W - margin; x += step) {
      let inGap = false;
      for (let g = 0; g < gapCenters.length; g++) {
        if (Math.abs(x - gapCenters[g]) < half + PROJ_R * DPR) {
          inGap = true;
          break;
        }
      }
      if (!inGap) list.push(makeProjectile(x, y0, vy, colorType, sd));
    }
    return list;
  }

  function spawnWave(w) {
    projectiles = [];
    waveHadNearMiss = false;
    const vy = fallSpeedForWave(w);
    if (w <= 10) currentPatternId = w;
    else currentPatternId = pickRandomPattern();

    const margin = PROJ_R * DPR * 2;

    function addAll(arr) {
      for (let i = 0; i < arr.length; i++) projectiles.push(arr[i]);
    }

    if (w > 10) {
      spawnRemixedWave(w, vy, currentPatternId);
    } else if (w === 1) {
      const cols = 8;
      for (let i = 0; i < cols; i++) {
        const x = ((i + 0.5) / cols) * W;
        addAll([makeProjectile(x, -PROJ_R * DPR, vy, 'straight', 0)]);
      }
    } else if (w === 2) {
      const rows = 5;
      for (let row = 0; row < rows; row++) {
        const n = row + 1;
        const spread = (W * 0.35) * (row / (rows - 1));
        const cx = W / 2;
        for (let k = 0; k < n; k++) {
          const t = n === 1 ? 0 : (k / (n - 1)) * 2 - 1;
          const x = cx + t * spread;
          const yOff = -PROJ_R * DPR - row * PROJ_R * 2.2 * DPR;
          addAll([makeProjectile(x, yOff, vy, 'formation', 0)]);
        }
      }
    } else if (w === 3) {
      for (let i = 0; i < 12; i++) {
        const x = margin + rnd() * (W - 2 * margin);
        const delay = i * 0.12;
        addAll([makeProjectile(x, -PROJ_R * DPR, vy, 'straight', delay)]);
      }
    } else if (w === 4) {
      const gapCenter = margin + rnd() * (W - 2 * margin);
      addAll(gapWallProjs(gapCenter, 60, vy, 'wall', -PROJ_R * DPR));
    } else if (w === 5) {
      const g1 = margin + rnd() * (W - 2 * margin);
      let g2 = margin + rnd() * (W - 2 * margin);
      if (Math.abs(g2 - g1) < 100 * DPR) g2 = clamp(g1 + 140 * DPR, margin, W - margin);
      addAll(gapWallProjs(g1, 60, vy, 'wall', -PROJ_R * DPR, 0));
      addAll(gapWallProjs(g2, 60, vy, 'wall', -PROJ_R * DPR, 0.8));
    } else if (w === 6) {
      const n = 14;
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const xL = margin + t * (W / 2 - margin);
        const xR = W - margin - t * (W / 2 - margin);
        const y = -PROJ_R * DPR - i * 8 * DPR;
        // Leave a gap in the center so the player has room to escape
        if (W / 2 - xL > 45 * DPR) {
          addAll([
            makeProjectile(xL, y, vy, 'formation', 0),
            makeProjectile(xR, y, vy, 'formation', 0)
          ]);
        }
      }
    } else if (w === 7) {
      const clusters = [
        { cx: W * 0.2, t: 0 },
        { cx: W * 0.5, t: 0.4 },
        { cx: W * 0.8, t: 0.8 }
      ];
      clusters.forEach(function (cl) {
        for (let k = -2; k <= 2; k++) {
          addAll([makeProjectile(cl.cx + k * PROJ_R * 2.2 * DPR, -PROJ_R * DPR, vy, 'straight', cl.t)]);
        }
      });
    } else if (w === 8) {
      const usable = W - 2 * margin;
      const gc = [];
      for (let z = 0; z < 3; z++) {
        const t = (z + 0.5 + (rnd() - 0.5) * 0.35) / 3.5;
        gc.push(margin + t * usable);
      }
      gc.sort(function (a, b) { return a - b; });
      addAll(curtainWallProjs(gc, 58, vy, 'wall', -PROJ_R * DPR, 0));
    } else if (w === 9) {
      for (let i = 0; i < 6; i++) {
        const px = playerX;
        addAll([makeProjectile(px, -PROJ_R * DPR, vy, 'chase', i * 0.35, { chase: true })]);
      }
    } else if (w === 10) {
      const vFast = vy * 1.15;
      for (let i = 0; i < 10; i++) {
        const x = margin + rnd() * (W - 2 * margin);
        addAll([makeProjectile(x, -PROJ_R * DPR, vFast, 'chaos', i * 0.08)]);
      }
      const g1 = margin + rnd() * (W - 2 * margin);
      let g2 = margin + rnd() * (W - 2 * margin);
      if (Math.abs(g2 - g1) < 90 * DPR) g2 = clamp(g1 + 150 * DPR, margin, W - margin);
      addAll(gapWallProjs(g1, 60, vFast, 'chaos', -PROJ_R * DPR - 45 * DPR, 0));
      addAll(gapWallProjs(g2, 60, vFast, 'chaos', -PROJ_R * DPR - 45 * DPR, 0.8));
    }

    waveTotalSpawned = projectiles.length;
    waveRemainingCount = waveTotalSpawned;
    waveFlashNum = w;
    waveFlashUntil = performance.now() + 500;
    sfxSpawnTick();
    updateTitle();
  }

  function pickRandomPattern() {
    return 1 + Math.floor(rnd() * 10);
  }

  function spawnRemixedWave(w, vy, pid) {
    const margin = PROJ_R * DPR * 2;
    function addAll(arr) {
      for (let i = 0; i < arr.length; i++) projectiles.push(arr[i]);
    }
    if (pid === 1) {
      for (let i = 0; i < 10; i++) {
        addAll([makeProjectile(((i + 0.5) / 10) * W, -PROJ_R * DPR, vy, 'straight', 0)]);
      }
    } else if (pid === 2) {
      const rows = 5;
      for (let row = 0; row < rows; row++) {
        const n = row + 1;
        const spread = (W * 0.35) * (row / Math.max(1, rows - 1));
        const cx = W / 2;
        for (let k = 0; k < n; k++) {
          const tt = n === 1 ? 0 : (k / (n - 1)) * 2 - 1;
          const x = cx + tt * spread;
          const yOff = -PROJ_R * DPR - row * PROJ_R * 2.2 * DPR;
          addAll([makeProjectile(x, yOff, vy, 'formation', 0)]);
        }
      }
    } else if (pid === 3) {
      for (let i = 0; i < 14; i++) {
        addAll([makeProjectile(margin + rnd() * (W - 2 * margin), -PROJ_R * DPR, vy, 'straight', i * 0.1)]);
      }
    } else if (pid === 4) {
      addAll(gapWallProjs(margin + rnd() * (W - 2 * margin), 60, vy, 'wall', -PROJ_R * DPR));
    } else if (pid === 5) {
      const g1 = margin + rnd() * (W - 2 * margin);
      let g2 = margin + rnd() * (W - 2 * margin);
      if (Math.abs(g2 - g1) < 100 * DPR) g2 = clamp(g1 + 140 * DPR, margin, W - margin);
      addAll(gapWallProjs(g1, 60, vy, 'wall', -PROJ_R * DPR, 0));
      addAll(gapWallProjs(g2, 60, vy, 'wall', -PROJ_R * DPR, 0.8));
    } else if (pid === 6) {
      const n = 16;
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const xL = margin + t * (W / 2 - margin);
        const xR = W - margin - t * (W / 2 - margin);
        const y = -PROJ_R * DPR - i * 7 * DPR;
        // Leave a gap in the center so the player has room to escape
        if (W / 2 - xL > 45 * DPR) {
          addAll([makeProjectile(xL, y, vy, 'formation', 0), makeProjectile(xR, y, vy, 'formation', 0)]);
        }
      }
    } else if (pid === 7) {
      const clusters = [{ cx: W * 0.25, t: 0 }, { cx: W * 0.5, t: 0.4 }, { cx: W * 0.75, t: 0.8 }];
      clusters.forEach(function (cl) {
        for (let k = -2; k <= 2; k++) {
          addAll([makeProjectile(cl.cx + k * PROJ_R * 2.2 * DPR, -PROJ_R * DPR, vy, 'straight', cl.t)]);
        }
      });
    } else if (pid === 8) {
      const usable = W - 2 * margin;
      const gc = [];
      for (let z = 0; z < 3; z++) {
        const t = (z + 0.45 + rnd() * 0.2) / 3.4;
        gc.push(margin + t * usable);
      }
      gc.sort(function (a, b) { return a - b; });
      addAll(curtainWallProjs(gc, 56, vy, 'wall', -PROJ_R * DPR, 0));
    } else if (pid === 9) {
      for (let i = 0; i < 7; i++) {
        addAll([makeProjectile(playerX, -PROJ_R * DPR, vy, 'chase', i * 0.32, { chase: true })]);
      }
    } else {
      const vFast = vy * 1.1;
      for (let i = 0; i < 12; i++) {
        addAll([makeProjectile(margin + rnd() * (W - 2 * margin), -PROJ_R * DPR, vFast, 'chaos', i * 0.06)]);
      }
      const g1 = margin + rnd() * (W - 2 * margin);
      let g2 = margin + rnd() * (W - 2 * margin);
      if (Math.abs(g2 - g1) < 90 * DPR) g2 = clamp(g1 + 150 * DPR, margin, W - margin);
      addAll(gapWallProjs(g1, 60, vFast, 'chaos', -PROJ_R * DPR - 35 * DPR, 0));
      addAll(gapWallProjs(g2, 60, vFast, 'chaos', -PROJ_R * DPR - 35 * DPR, 0.75));
    }
  }

  function startGame(opts) {
    opts = opts || {};
    resumeAudio();
    sfxStart();
    titleScreen = 'main';
    runMode = opts.mode || 'classic';
    practiceStartWave = clamp(opts.practiceWave | 0, 1, 99);
    if (practiceStartWave < 1) practiceStartWave = 1;
    lastRunOpts = { mode: runMode, practiceWave: practiceStartWave };

    if (runMode === 'daily') {
      useSeededRng = true;
      setRngSeed(getDailySeed());
    } else {
      useSeededRng = false;
    }

    gameState = 'playing';
    wave = runMode === 'practice' ? practiceStartWave : 1;
    wavesSurvived = runMode === 'practice' ? Math.max(0, practiceStartWave - 1) : 0;
    newBestFlag = false;
    newDailyBestFlag = false;
    statNearMisses = 0;
    statPerfectStreak = 0;
    statBestPerfectStreak = 0;
    waveHadNearMiss = false;
    runStartTime = performance.now();
    ghostRecord = [];
    ghostPlayback = runMode !== 'practice' && lastGhostRun && lastGhostRun.length ? lastGhostRun.slice() : null;

    window.__trail = [];
    playerX = W / 2;
    playerTargetX = playerX;
    projectiles = [];
    particles = [];
    bottomExitFlashes = [];
    vignetteDeathT = -1;
    spawnWave(wave);
    updateTitle();
  }

  function beginBreather(nextW) {
    gameState = 'breather';
    nextWaveNum = nextW;
    breatherEnd = performance.now() + 2000;
    countdownPhase = -1;
    sfxWaveClear();
    try {
      if (navigator.vibrate) navigator.vibrate(12);
    } catch (err) {}
    for (let i = 0; i < 8; i++) {
      particles.push({
        type: 'confetti',
        x: playerX,
        y: playerY(),
        vx: (Math.random() - 0.5) * 40 * DPR,
        vy: -30 - Math.random() * 40 * DPR,
        life: 1.5,
        maxLife: 1.5,
        r: (3 + Math.random() * 2) * DPR,
        color: COLORS.player
      });
    }
  }

  function playerY() {
    return H - PLAYER_BOTTOM * DPR;
  }

  function triggerGameOver() {
    if (gameState === 'gameover') return;
    gameState = 'gameover';
    gameOverAt = performance.now();
    gameOverOverlayStart = gameOverAt + 600;
    deathShakeUntil = gameOverAt + 400;
    deathShakeStart = gameOverAt;
    vignetteDeathT = 0;
    sfxDeath();
    spawnDeathParticles();

    if (runMode !== 'practice' && ghostRecord.length) {
      lastGhostRun = ghostRecord.slice();
    }

    const prevBest = highScore;
    const cleared = Math.max(0, wavesSurvived);
    newBestFlag = runMode !== 'practice' && cleared > prevBest;
    if (newBestFlag) {
      highScore = cleared;
      saveHigh(highScore);
    }

    newDailyBestFlag = false;
    if (runMode === 'daily') {
      const dk = getDailyDateKey();
      const todayBest = dailyBestDate === dk ? dailyBestScore : 0;
      if (cleared > todayBest) {
        newDailyBestFlag = true;
        saveDailyBest(dk, cleared);
      }
    }

    document.title = 'GAME OVER | Wave ' + pad2(wave);
  }

  function spawnDeathParticles() {
    const px = playerX;
    const py = playerY();
    for (let i = 0; i < 30; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = (200 + Math.random() * 200) * DPR;
      particles.push({
        type: 'burst',
        x: px,
        y: py,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.8,
        maxLife: 0.8,
        r: (3 + Math.random() * 2) * DPR,
        color: Math.random() > 0.5 ? COLORS.player : '#ffffff',
        gy: 300 * DPR
      });
    }
  }

  function dist2(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  function updatePlaying(dt, now) {
    const py = playerY();
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
      playerTargetX -= MOVE_SPEED * dt * DPR;
    }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) {
      playerTargetX += MOVE_SPEED * dt * DPR;
    }
    playerTargetX = clamp(playerTargetX, PLAYER_R * DPR, W - PLAYER_R * DPR);
    playerX = playerTargetX;

    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      if (p.removed) continue;
      if (p.spawnT > 0) {
        p.spawnT -= dt;
        if (p.spawnT <= 0) {
          p.active = true;
          if (p.meta && p.meta.chase) p.x = playerX;
        }
        continue;
      }
      if (!p.active) continue;
      p.spawnAnim = Math.min(1, p.spawnAnim + dt / 0.15);
      p.scale = p.spawnAnim;
      p.y += p.vy * dt;
      p.rot += (Math.PI * 2) * dt;

      const rEff = COLL_PROJ * DPR * p.scale;
      const pr = COLL_PLAYER * DPR;
      const d2 = dist2(p.x, p.y, playerX, py);
      const collDist = pr + rEff;
      if (d2 < collDist * collDist) {
        triggerGameOver();
        return;
      }
      const dist = Math.sqrt(d2);
      if (!p.nearMissed && dist < NEAR_MISS * DPR && dist >= collDist) {
        p.nearMissed = true;
        statNearMisses++;
        waveHadNearMiss = true;
        sfxNearMiss();
        spawnNearMissFx(p.x, p.y, playerX, py);
      }

      if (p.y > H + PROJ_R * DPR * 2) {
        p.removed = true;
        bottomExitFlashes.push({ x: p.x, t: 0.25, max: 0.25 });
        continue;
      }
    }

    waveRemainingCount = projectiles.filter(function (p) { return !p.removed; }).length;

    const anyActive = projectiles.some(function (p) {
      if (p.removed) return false;
      if (p.spawnT > 0) return true;
      return p.active && p.y <= H + PROJ_R * DPR * 2;
    });

    if (!anyActive && projectiles.length > 0) {
      if (!waveHadNearMiss) {
        statPerfectStreak++;
        statBestPerfectStreak = Math.max(statBestPerfectStreak, statPerfectStreak);
      } else {
        statPerfectStreak = 0;
      }
      waveHadNearMiss = false;
      fullScreenGreen = 0.35;
      wavesSurvived++;
      wave++;
      beginBreather(wave);
    }
  }

  function updateJuice(dt) {
    if (fullScreenGreen > 0) fullScreenGreen = Math.max(0, fullScreenGreen - dt * 2.2);
    for (let i = bottomExitFlashes.length - 1; i >= 0; i--) {
      const f = bottomExitFlashes[i];
      f.t -= dt;
      if (f.t <= 0) bottomExitFlashes.splice(i, 1);
    }
    if (gameState === 'gameover' && vignetteDeathT >= 0 && vignetteDeathT < 0.4) {
      vignetteDeathT += dt;
    }
  }

  function spawnNearMissFx(px, py, plx, ply) {
    const mx = (px + plx) / 2;
    const my = (py + ply) / 2;
    for (let i = 0; i < 6; i++) {
      const dir = i % 2 === 0 ? -1 : 1;
      particles.push({
        type: 'spark',
        x: mx,
        y: my,
        vx: dir * (80 + Math.random() * 60) * DPR,
        vy: (Math.random() - 0.5) * 30 * DPR,
        life: 0.4,
        maxLife: 0.4,
        r: 2 * DPR,
        color: '#ffffff'
      });
    }
    particles.push({
      type: 'floattext',
      x: plx,
      y: ply - 20 * DPR,
      text: 'CLOSE!',
      life: 0.6,
      maxLife: 0.6,
      vy: -40 * DPR
    });
  }

  function updateBreather(dt, now) {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
      playerTargetX -= MOVE_SPEED * dt * DPR;
    }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) {
      playerTargetX += MOVE_SPEED * dt * DPR;
    }
    playerTargetX = clamp(playerTargetX, PLAYER_R * DPR, W - PLAYER_R * DPR);
    playerX = playerTargetX;
    const left = (breatherEnd - now) / 1000;
    if (left <= 0) {
      gameState = 'playing';
      spawnWave(nextWaveNum);
      return;
    }
    const sec = Math.max(1, Math.ceil(left - 0.001));
    if (sec <= 2 && sec !== countdownPhase) {
      countdownPhase = sec;
      sfxCountdown();
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt;
      if (q.type === 'burst') {
        q.vy += q.gy * dt;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
      } else if (q.type === 'confetti' || q.type === 'spark') {
        q.x += q.vx * dt;
        q.y += q.vy * dt;
      } else if (q.type === 'floattext') {
        q.y += q.vy * dt;
      }
      if (q.life <= 0) particles.splice(i, 1);
    }
  }

  function updateStars(dt) {
    const sp = (gameState === 'title' ? 5 : starDriftSpeed()) * dt;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.y += sp;
      s.tw += dt * 0.5;
      if (s.y > H) s.y = 0;
    }
  }

  function updateDemoProjs(dt) {
    for (let i = 0; i < demoProjs.length; i++) {
      const p = demoProjs[i];
      p.y += p.vy * dt;
      p.rot += dt;
      if (p.y > H + 20) {
        p.y = -20;
        p.x = (0.15 + 0.7 * Math.random()) * W;
      }
    }
  }

  function drawBackground(now) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;
    const pulse = 0.5 + 0.5 * Math.sin(now / 1000 * (Math.PI * 2 / 1.5));
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.65);
    grd.addColorStop(0, 'rgba(' + themeAccentRgb + ',' + (0.04 + pulse * 0.02) + ')');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    const vig = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.2, cx, cy, Math.max(W, H) * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const a = 0.4 + 0.3 * Math.sin(s.tw);
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      const sz = Math.max(1, s.s);
      ctx.fillRect(s.x, s.y, sz, sz);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = DPR;
    const step = 50 * DPR;
    for (let x = 0; x < W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawProjectile(p) {
    if (p.spawnT > 0) return;
    if (!p.active) return;
    const col = projColor(p);
    const r = PROJ_R * DPR * p.scale;
    const x = p.x, y = p.y;
    drawGlowingOrb(x, y, r, col, 28 * DPR * p.scale, 38 * DPR * p.scale, 48 * DPR * p.scale);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot);
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5 * DPR;
    ctx.globalAlpha = 0.9;
    const cr = r * 0.45;
    ctx.beginPath();
    ctx.moveTo(-cr, 0);
    ctx.lineTo(cr, 0);
    ctx.moveTo(0, -cr);
    ctx.lineTo(0, cr);
    ctx.stroke();
    ctx.restore();
  }

  function drawGlowingOrb(x, y, rCore, col, g1, g2, g3) {
    ctx.save();
    function ring(rad, a) {
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      if (col.indexOf('hsl(') === 0) {
        ctx.fillStyle = col.replace(/^hsl\(([^)]+)\)$/, 'hsla($1,' + a + ')');
      } else {
        const rgb = hexToRgb(col);
        ctx.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + a + ')';
      }
      ctx.fill();
    }
    ring(g3, 0.03);
    ring(g2, 0.08);
    ring(g1, 0.15);
    ctx.beginPath();
    ctx.arc(x, y, rCore, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16)
    };
  }

  function drawPlayer(now, overrideY) {
    const py = overrideY != null ? overrideY : playerY();
    const moveDx = playerX - prevPlayerX;
    const moving = Math.abs(moveDx) > 0.5 * DPR;
    const stretch = moving ? 1.2 : 1;
    const squash = moving ? 0.85 : 1;
    const pulse = Math.sin(now / 1000 * (Math.PI * 2 / 1.5));
    const gBase = (28 + (pulse * 0.5 + 0.5) * 6) * DPR;
    const breathBright = gameState === 'breather';
    const gMul = breathBright ? 1.5 : 1;
    const gx1 = gBase * gMul, gx2 = (gBase + 10 * DPR) * gMul, gx3 = (gBase + 20 * DPR) * gMul;

    if (gameState !== 'title') {
      const trail = window.__trail || (window.__trail = []);
      trail.push({ x: playerX, y: py });
      while (trail.length > 6) trail.shift();
      const opacities = [0.4, 0.3, 0.2, 0.15, 0.08, 0.03];
      for (let i = 0; i < trail.length - 1; i++) {
        const trp = trail[i];
        const op = opacities[trail.length - 2 - i] || 0.03;
        const tr = PLAYER_R * DPR * (0.85 - i * 0.08);
        ctx.globalAlpha = op;
        ctx.beginPath();
        ctx.arc(trp.x, trp.y, tr, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.player;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.translate(playerX, py);
    if (moving) {
      ctx.scale(stretch, squash);
    }
    drawGlowingOrb(0, 0, PLAYER_R * DPR, COLORS.player, gx1, gx2, gx3);
    ctx.beginPath();
    ctx.arc(-PLAYER_R * DPR * 0.35, -PLAYER_R * DPR * 0.35, 5 * DPR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();
    ctx.restore();
  }

  function drawUI(now) {
    const mono = "'Courier New', Courier, monospace";
    const stripTop = H - UI_STRIP * DPR;

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(0, stripTop, W, 1 * DPR);

    ctx.font = (13 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    const wv = pad2(gameState === 'playing' || gameState === 'breather' ? wave : (gameState === 'gameover' ? wave : 1));
    ctx.fillText('WAVE ' + wv, 12 * DPR, 22 * DPR);
    const dotT = now / 300;
    for (let d = 0; d < 3; d++) {
      const a = 0.3 + 0.7 * Math.sin(dotT + d * 1.2);
      ctx.globalAlpha = a;
      ctx.fillText('.', 12 * DPR + (50 + d * 8) * DPR, 22 * DPR);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + (20 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    const scoreDisp = pad2(Math.max(0, wavesSurvived));
    ctx.fillText('▲ ' + scoreDisp, W / 2, 26 * DPR);

    ctx.textAlign = 'right';
    ctx.font = (13 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('BEST ' + pad2(highScore), W - 12 * DPR, 22 * DPR);
    ctx.textAlign = 'left';

    if (runMode === 'daily' && (gameState === 'playing' || gameState === 'breather')) {
      ctx.font = (8 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(0,245,255,0.75)';
      ctx.fillText('DAILY', 12 * DPR, 36 * DPR);
    } else if (runMode === 'practice' && (gameState === 'playing' || gameState === 'breather')) {
      ctx.font = (8 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(255,190,11,0.8)';
      ctx.fillText('PRAC', 12 * DPR, 36 * DPR);
    }

    if (gameState === 'playing' || gameState === 'breather') {
      const rem = waveRemainingCount;
      const tot = Math.max(1, waveTotalSpawned);
      const prog = 1 - rem / tot;
      ctx.fillStyle = COLORS.player;
      ctx.fillRect(0, 0, W * prog, 3 * DPR);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5 * DPR;
    const ix = 20 * DPR;
    const iy = stripTop + 14 * DPR;
    ctx.beginPath();
    ctx.arc(ix, iy - 4 * DPR, 5 * DPR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ix, iy);
    ctx.lineTo(ix, iy + 10 * DPR);
    ctx.stroke();

    ctx.font = (11 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('DRAG TO DODGE', 34 * DPR, stripTop + 18 * DPR);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('← → also works', W - 12 * DPR, stripTop + 18 * DPR);
    ctx.textAlign = 'left';
  }

  function pad2(n) {
    n = Math.floor(n);
    return (n < 10 ? '0' : '') + n;
  }

  function cycleThemeDir(dir) {
    const n = THEME_DEFS.length;
    for (let k = 0; k < n; k++) {
      themeIndex = (themeIndex + dir + n) % n;
      if (themeUnlocked(themeIndex)) {
        applyTheme(themeIndex);
        saveTheme();
        return;
      }
    }
  }

  function handleTitlePointer(mx, my) {
    for (let i = titleRegions.length - 1; i >= 0; i--) {
      const r = titleRegions[i];
      if (!pointInRect(mx, my, r.x, r.y, r.w, r.h)) continue;
      if (r.act === 'classic') {
        startGame({ mode: 'classic' });
        return true;
      }
      if (r.act === 'daily') {
        startGame({ mode: 'daily' });
        return true;
      }
      if (r.act === 'practice_menu') {
        titleScreen = 'practice';
        return true;
      }
      if (r.act === 'practice_back') {
        titleScreen = 'main';
        return true;
      }
      if (r.act === 'practice_go') {
        startGame({ mode: 'practice', practiceWave: r.pWave });
        return true;
      }
      if (r.act === 'theme_prev') {
        cycleThemeDir(-1);
        return true;
      }
      if (r.act === 'theme_next') {
        cycleThemeDir(1);
        return true;
      }
    }
    return false;
  }

  function buildRunSummaryForShare() {
    const cleared = Math.max(0, wavesSurvived);
    const sec = Math.max(0, Math.floor((gameOverAt - runStartTime) / 1000));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const timeStr = (m > 0 ? m + 'm ' : '') + s + 's';
    let line = 'DODGE WAVE | Cleared: ' + pad2(cleared) + ' | Fell on wave ' + pad2(wave) + ' | Close calls: ' + statNearMisses + ' | Best clean streak: ' + statBestPerfectStreak + ' | ' + timeStr;
    if (runMode === 'daily') line += ' | DAILY ' + getDailyDateKey();
    if (runMode === 'practice') line += ' | PRACTICE W' + pad2(practiceStartWave);
    return line;
  }

  function tryCopyScore() {
    copyToastUntil = performance.now() + 2200;
    const t = buildRunSummaryForShare();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(function () {});
    }
  }

  function handleGameOverPointer(mx, my) {
    for (let i = gameOverRegions.length - 1; i >= 0; i--) {
      const r = gameOverRegions[i];
      if (!pointInRect(mx, my, r.x, r.y, r.w, r.h)) continue;
      if (r.act === 'copy') {
        tryCopyScore();
        return true;
      }
      if (r.act === 'retry') {
        startGame(lastRunOpts);
        return true;
      }
    }
    return false;
  }

  function recordGhostSample() {
    if (ghostRecord.length < 16000) ghostRecord.push(playerX);
  }

  function drawGhostOrb() {
    if (!ghostPlayback || ghostPlayback.length < 2) return;
    const py = playerY();
    const fi = ghostRecord.length - 1;
    const gi = Math.min(Math.max(0, fi), ghostPlayback.length - 1);
    for (let s = 0; s < 12; s++) {
      const j = gi - s * 2;
      if (j < 0) break;
      const gx = ghostPlayback[j];
      ctx.save();
      ctx.globalAlpha = 0.07 * (1 - s / 12);
      ctx.beginPath();
      ctx.arc(gx, py, (PLAYER_R - 5) * DPR, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.player;
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBreatherUI(now) {
    const leftSec = Math.max(0, (breatherEnd - now) / 1000);
    const sec = Math.max(1, Math.ceil(leftSec - 0.001));
    ctx.textAlign = 'center';
    const mono = "'Courier New', Courier, monospace";
    const pulse = 1 + 0.04 * Math.sin(now / 200);
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40 * DPR);
    ctx.scale(pulse, pulse);
    ctx.font = 'bold ' + (28 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('WAVE ' + pad2(nextWaveNum), 0, 0);
    ctx.font = (18 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('INCOMING IN ' + Math.max(1, sec), 0, 32 * DPR);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawWaveFlash(now) {
    if (now > waveFlashUntil) return;
    const t = 1 - (waveFlashUntil - now) / 500;
    const mono = "'Courier New', Courier, monospace";
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + (42 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('WAVE ' + pad2(waveFlashNum), W / 2, H / 2);
    ctx.restore();
  }

  function drawTitle(now) {
    titleRegions = [];
    const mono = "'Courier New', Courier, monospace";
    ctx.textAlign = 'center';
    const cx = W / 2;

    for (let i = 0; i < demoProjs.length; i++) {
      const p = demoProjs[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      drawGlowingOrb(0, 0, PROJ_R * DPR * 0.9, p.color, 22 * DPR, 30 * DPR, 38 * DPR);
      ctx.restore();
    }

    if (titleScreen === 'practice') {
      ctx.font = 'bold ' + (18 * DPR) + 'px ' + mono;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('PRACTICE', cx, 44 * DPR);
      ctx.font = (11 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('Pick a wave to drill · scores here do not save to BEST', cx, 64 * DPR);

      const cols = 5, rows = 2;
      const cellW = Math.min(56 * DPR, (W - 48 * DPR) / cols - 8 * DPR);
      const cellH = 40 * DPR;
      const gap = 8 * DPR;
      const gridW = cols * cellW + (cols - 1) * gap;
      const sx = cx - gridW / 2;
      const sy = 92 * DPR;
      let wn = 1;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const rx = sx + c * (cellW + gap);
          const ry = sy + r * (cellH + gap);
          ctx.fillStyle = 'rgba(255,255,255,0.07)';
          ctx.fillRect(rx, ry, cellW, cellH);
          ctx.strokeStyle = 'rgba(255,255,255,0.22)';
          ctx.strokeRect(rx, ry, cellW, cellH);
          ctx.font = 'bold ' + (15 * DPR) + 'px ' + mono;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(pad2(wn), rx + cellW / 2, ry + cellH / 2 + 5 * DPR);
          titleRegions.push({ x: rx, y: ry, w: cellW, h: cellH, act: 'practice_go', pWave: wn });
          wn++;
        }
      }

      const bw = Math.min(W - 80 * DPR, 200 * DPR);
      const bh = 38 * DPR;
      const bx = cx - bw / 2;
      const by = H - 100 * DPR;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(bx, by, bw, bh);
      ctx.font = 'bold ' + (12 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText('BACK', cx, by + 24 * DPR);
      titleRegions.push({ x: bx, y: by, w: bw, h: bh, act: 'practice_back' });

      ctx.font = (10 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillText('Back to change mode (daily / themes)', cx, H - 32 * DPR);
      ctx.textAlign = 'left';
      return;
    }

    const cy = H * 0.2;
    ctx.save();
    ctx.font = 'bold ' + (30 * DPR) + 'px ' + mono;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 22 * DPR;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('DODGE WAVE', cx, cy);
    ctx.shadowBlur = 10 * DPR;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('DODGE WAVE', cx, cy);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('DODGE WAVE', cx, cy);
    ctx.restore();

    ctx.font = (11 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.48)';
    ctx.fillText('patterns · reflex · one more run', cx, cy + 22 * DPR);

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST RUN  ' + pad2(highScore) + '  WAVES', cx, cy + 40 * DPR);

    const dk = getDailyDateKey();
    const todayShow = dailyBestDate === dk ? pad2(dailyBestScore) : '— —';
    ctx.fillStyle = 'rgba(0,245,255,0.55)';
    ctx.fillText("TODAY'S BEST  " + todayShow + '  (daily mode)', cx, cy + 56 * DPR);

    const tRowY = cy + 76 * DPR;
    const tBoxW = Math.min(300 * DPR, W - 100 * DPR);
    const tH = 34 * DPR;
    const tLeft = cx - tBoxW / 2;
    const arrW = 32 * DPR;
    titleRegions.push({ x: tLeft - arrW - 8 * DPR, y: tRowY, w: arrW, h: tH, act: 'theme_prev' });
    titleRegions.push({ x: tLeft + tBoxW + 8 * DPR, y: tRowY, w: arrW, h: tH, act: 'theme_next' });

    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(tLeft, tRowY, tBoxW, tH);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.strokeRect(tLeft, tRowY, tBoxW, tH);
    ctx.font = 'bold ' + (11 * DPR) + 'px ' + mono;
    const thDef = THEME_DEFS[themeIndex];
    const locked = !themeUnlocked(themeIndex);
    ctx.fillStyle = locked ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.92)';
    ctx.fillText((locked ? '[locked] ' : '') + thDef.label + (locked ? '  @ w' + pad2(thDef.unlock) : ''), cx, tRowY + 22 * DPR);

    ctx.font = (12 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('◀', tLeft - arrW / 2 - 4 * DPR, tRowY + 22 * DPR);
    ctx.fillText('▶', tLeft + tBoxW + arrW / 2 + 4 * DPR, tRowY + 22 * DPR);

    drawPlayer(now, H * 0.38);

    const btnW = Math.min(W - 36 * DPR, 308 * DPR);
    const btnH = 44 * DPR;
    let by = H - 210 * DPR;

    function titleButton(label, sub, act, fillRgb, alpha) {
      const bx = cx - btnW / 2;
      titleRegions.push({ x: bx, y: by, w: btnW, h: btnH, act: act });
      ctx.fillStyle = 'rgba(' + fillRgb + ',' + alpha + ')';
      ctx.fillRect(bx, by, btnW, btnH);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.strokeRect(bx, by, btnW, btnH);
      ctx.font = 'bold ' + (13 * DPR) + 'px ' + mono;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, cx, by + 20 * DPR);
      if (sub) {
        ctx.font = (9 * DPR) + 'px ' + mono;
        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.fillText(sub, cx, by + 34 * DPR);
      }
      by += btnH + 8 * DPR;
    }

    titleButton('PLAY', 'Endless run · ghost follows your last classic/daily', 'classic', themeAccentRgb, 0.18);
    titleButton('DAILY CHALLENGE', 'Same RNG for everyone today · compete on TODAY', 'daily', '0,245,255', 0.12);
    titleButton('PRACTICE', 'Start on any wave 1–10', 'practice_menu', '255,190,11', 0.1);

    ctx.font = (9 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillText('Themes unlock as you push deeper · Space = quick classic', cx, H - 26 * DPR);

    ctx.textAlign = 'left';
  }

  function drawGameOver(now) {
    gameOverRegions = [];
    const t = Math.min(1, (now - gameOverOverlayStart) / 400);
    if (now < gameOverOverlayStart) return;
    ctx.save();
    ctx.globalAlpha = t;
    const mono = "'Courier New', Courier, monospace";
    const cx = W / 2;
    const cleared = Math.max(0, wavesSurvived);
    const runSec = Math.max(0, Math.floor((gameOverAt - runStartTime) / 1000));
    const rm = Math.floor(runSec / 60);
    const rs = runSec % 60;
    const timeStr = (rm > 0 ? rm + 'm ' : '') + rs + 's';

    ctx.textAlign = 'center';
    let y0 = H / 2 - 118 * DPR;

    if (newBestFlag && ((now / 200) % 2 < 1)) {
      ctx.font = 'bold ' + (16 * DPR) + 'px ' + mono;
      ctx.fillStyle = COLORS.cyan;
      ctx.fillText('NEW PERSONAL BEST!', cx, y0);
      y0 += 22 * DPR;
    }
    if (newDailyBestFlag && ((now / 250) % 2 < 1)) {
      ctx.font = 'bold ' + (15 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(0,245,255,0.95)';
      ctx.fillText('NEW DAILY BEST!', cx, y0);
      y0 += 22 * DPR;
    }

    ctx.font = (12 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    if (runMode === 'daily') ctx.fillText('DAILY RUN · ' + getDailyDateKey(), cx, y0);
    else if (runMode === 'practice') ctx.fillText('PRACTICE · from wave ' + pad2(practiceStartWave), cx, y0);
    else ctx.fillText('CLASSIC RUN', cx, y0);
    y0 += 20 * DPR;

    ctx.font = (13 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText('WAVES CLEARED  ' + pad2(cleared), cx, y0);
    y0 += 26 * DPR;

    ctx.font = 'bold ' + (30 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('FELL ON  ' + pad2(wave), cx, y0);
    y0 += 36 * DPR;

    ctx.font = (11 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('Time alive  ' + timeStr + '   ·   Close calls  ' + statNearMisses, cx, y0);
    y0 += 16 * DPR;
    ctx.fillText('Best clean streak  ' + statBestPerfectStreak + '  (waves with no close call)', cx, y0);
    y0 += 22 * DPR;

    let badge = '';
    if (statNearMisses === 0 && cleared >= 5) badge = 'FLAWLESS RUN — not a single close call';
    else if (statBestPerfectStreak >= 4) badge = 'ICE VEINS — ' + statBestPerfectStreak + ' clean waves in a row';
    else if (statNearMisses >= 20) badge = 'SCRAPER — lived dangerously';
    if (badge) {
      ctx.font = 'bold ' + (10 * DPR) + 'px ' + mono;
      ctx.fillStyle = 'rgba(' + themeAccentRgb + ',0.9)';
      ctx.fillText(badge, cx, y0);
      y0 += 20 * DPR;
    }

    ctx.font = (12 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.48)';
    ctx.fillText('BEST: ' + pad2(highScore) + ' WAVES', cx, y0);
    y0 += 22 * DPR;

    let flavor = 'Keep practicing';
    if (cleared >= 3 && cleared <= 5) flavor = 'Getting warmer';
    else if (cleared >= 6 && cleared <= 9) flavor = 'Impressive reflexes';
    else if (cleared >= 10) flavor = 'Are you even human?';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(flavor, cx, y0);
    y0 += 36 * DPR;

    const pillW = Math.min(148 * DPR, (W - 48 * DPR) / 2 - 6 * DPR);
    const pillH = 36 * DPR;
    const gapP = 10 * DPR;
    const totalPW = pillW * 2 + gapP;
    const px0 = cx - totalPW / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(px0, y0, pillW, pillH);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(px0, y0, pillW, pillH);
    ctx.font = 'bold ' + (11 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('COPY SCORE', px0 + pillW / 2, y0 + 23 * DPR);
    gameOverRegions.push({ x: px0, y: y0, w: pillW, h: pillH, act: 'copy' });

    const px1 = px0 + pillW + gapP;
    ctx.fillStyle = 'rgba(' + themeAccentRgb + ',0.25)';
    ctx.fillRect(px1, y0, pillW, pillH);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeRect(px1, y0, pillW, pillH);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('AGAIN', px1 + pillW / 2, y0 + 23 * DPR);
    gameOverRegions.push({ x: px1, y: y0, w: pillW, h: pillH, act: 'retry' });

    y0 += pillH + 14 * DPR;
    ctx.font = (10 * DPR) + 'px ' + mono;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText(isTouchDevice ? 'Tap outside buttons to retry · C copies' : 'R / click outside — retry   ·   C — copy', cx, y0);

    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawCopyToast(now) {
    if (now > copyToastUntil) return;
    const mono = "'Courier New', Courier, monospace";
    const left = copyToastUntil - now;
    ctx.save();
    ctx.globalAlpha = Math.min(1, left / 380);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(W / 2 - 100 * DPR, 48 * DPR, 200 * DPR, 32 * DPR);
    ctx.strokeStyle = 'rgba(0,245,255,0.5)';
    ctx.strokeRect(W / 2 - 100 * DPR, 48 * DPR, 200 * DPR, 32 * DPR);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + (12 * DPR) + 'px ' + mono;
    ctx.fillStyle = '#00f5ff';
    ctx.fillText('COPIED TO CLIPBOARD', W / 2, 68 * DPR);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const q = particles[i];
      const a = Math.max(0, q.life / q.maxLife);
      if (q.type === 'floattext') {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.font = 'bold ' + (14 * DPR) + 'px ' + "'Courier New', Courier, monospace";
        ctx.fillStyle = '#ffff00';
        ctx.fillText(q.text, q.x, q.y);
        ctx.restore();
        continue;
      }
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
      ctx.fillStyle = q.color;
      ctx.fill();
      ctx.restore();
    }
  }

  function drawOverlays() {
    if (fullScreenGreen > 0) {
      ctx.fillStyle = 'rgba(0,255,100,0.1)';
      ctx.fillRect(0, 0, W, H);
    }
    for (let i = 0; i < bottomExitFlashes.length; i++) {
      const f = bottomExitFlashes[i];
      const a = (f.max > 0 ? f.t / f.max : 0) * 0.6;
      ctx.fillStyle = 'rgba(0,255,120,' + a + ')';
      ctx.fillRect(f.x - 15 * DPR, H - 8 * DPR, 30 * DPR, 8 * DPR);
    }
    if (gameState === 'gameover' && vignetteDeathT >= 0 && vignetteDeathT <= 0.4) {
      const t = vignetteDeathT;
      let alpha = 0;
      if (t < 0.1) alpha = t / 0.1 * 0.5;
      else if (t < 0.4) alpha = 0.5 * (1 - (t - 0.1) / 0.3);
      if (alpha > 0) {
        const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.9);
        g.addColorStop(0, 'rgba(255,0,0,0)');
        g.addColorStop(1, 'rgba(255,0,0,' + alpha + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  function getShake(now) {
    if (now > deathShakeUntil) return { x: 0, y: 0 };
    const left = 1 - (now - deathShakeStart) / 400;
    const mag = 8 * DPR * left;
    return { x: (Math.random() * 2 - 1) * mag, y: (Math.random() * 2 - 1) * mag };
  }

  function updateTitle() {
    if (gameState === 'gameover') return;
    let pre = 'DODGE WAVE';
    if (runMode === 'daily') pre = 'DAILY';
    else if (runMode === 'practice') pre = 'PRACTICE';
    document.title = pre + ' | Wave ' + pad2(wave);
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (!lastT) lastT = now;
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > DT_CAP) dt = DT_CAP;

    prevPlayerX = playerX;
    updateStars(dt);
    updateParticles(dt);

    if (gameState === 'title') {
      updateDemoProjs(dt);
      drawBackground(now);
      drawTitle(now);
      return;
    }

    updateJuice(dt);

    const sh = gameState === 'gameover' ? getShake(now) : { x: 0, y: 0 };
    ctx.save();
    ctx.translate(sh.x, sh.y);

    drawBackground(now);

    if (gameState === 'playing') {
      updatePlaying(dt, now);
      recordGhostSample();
    } else if (gameState === 'breather') {
      updateBreather(dt, now);
      recordGhostSample();
    }

    for (let i = 0; i < projectiles.length; i++) {
      drawProjectile(projectiles[i]);
    }

    drawGhostOrb();
    if (gameState !== 'gameover') drawPlayer(now);

    drawParticles();
    drawOverlays();

    ctx.restore();

    ctx.save();
    if (gameState !== 'title') drawUI(now);
    if (gameState === 'breather') drawBreatherUI(now);
    drawWaveFlash(now);
    if (gameState === 'gameover') drawGameOver(now);
    drawCopyToast(now);
    ctx.restore();
  }

  function canvasPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      mx: (clientX - rect.left) * (W / rect.width),
      my: (clientY - rect.top) * (H / rect.height)
    };
  }

  function onPointerDown(e) {
    resumeAudio();
    const p = canvasPointer(e);
    if (gameState === 'title') {
      pointerDown = false;
      handleTitlePointer(p.mx, p.my);
      return;
    }
    if (gameState === 'gameover' && performance.now() > gameOverOverlayStart) {
      pointerDown = false;
      if (!handleGameOverPointer(p.mx, p.my)) {
        startGame(lastRunOpts);
      }
      return;
    }
    pointerDown = true;
    playerTargetX = clamp(p.mx, PLAYER_R * DPR, W - PLAYER_R * DPR);
  }
  function onPointerMove(e) {
    if (!pointerDown && !e.touches) return;
    const p = canvasPointer(e);
    if (e.touches || pointerDown) {
      playerTargetX = clamp(p.mx, PLAYER_R * DPR, W - PLAYER_R * DPR);
    }
    if (e.touches) e.preventDefault();
  }
  function onPointerUp(e) {
    pointerDown = false;
  }

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    onPointerMove(e);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', onPointerUp);

  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (e.repeat) return;
    resumeAudio();
    if (gameState === 'title') {
      if ((e.key === ' ' || e.key === 'Enter') && titleScreen === 'main') {
        e.preventDefault();
        startGame({ mode: 'classic' });
      }
      return;
    }
    if (gameState === 'gameover' && performance.now() > gameOverOverlayStart) {
      if (e.key === 'c' || e.key === 'C') {
        tryCopyScore();
        return;
      }
      if (e.key === 'r' || e.key === 'R') {
        startGame(lastRunOpts);
      }
    }
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key] = false;
  });

  loadHigh();
  loadDailyBest();
  loadTheme();
  resize();
  window.addEventListener('resize', resize);

  lastT = 0;
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
